name = "beacon-b2-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = "https://beacon-b2-dashboard.pages.dev"
WORKER_URL = "https://beacon-b2-api.iddqd777.workers.dev"
PAGES_PREVIEW_SUFFIX = ".beacon-b2-dashboard.pages.dev"
# B2 (S3-compatible) storage — single private EU bucket with key prefixes:
# branding/ (logos), components/ + rustdesk-installer/ (component files), sessions/ (transfers).
B2_ENDPOINT = "https://s3.eu-central-003.backblazeb2.com"
B2_REGION = "eu-central-003"
B2_BUCKET = "rommm13-beacon-storage"
B2_BUCKET_LOGOS = "rommm13-beacon-storage"
B2_BUCKET_COMPONENT_FILES = "rommm13-beacon-storage"
B2_BUCKET_SESSION_FILES = "rommm13-beacon-storage"

[[d1_databases]]
binding = "DB"
database_name = "beacon-pilot"
database_id = "aa33fd74-e80a-4dba-8cb3-9a3e54621a39"
migrations_dir = "../migrations"

[[durable_objects.bindings]]
name = "SESSION"
class_name = "SessionRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionRelay"]

[triggers]
crons = ["*/2 * * * *"]
